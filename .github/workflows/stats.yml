
name: Generate stats card

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate stats.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dracula&locale=pt-br
          path: stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit stats card
        uses: actions/checkout@v6
      
